<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280" />
    </marker>

    <style type="text/css"><![CDATA[
      svg { font-family: "Cairo", "Noto Naskh Arabic", "Helvetica Neue", Arial, sans-serif; }
      .header { font-size: 26px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 16px; fill: #475569; }
      .box-title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .box-text { font-size: 14px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .card { rx: 12; ry: 12; fill: #fff; stroke: #E6EEF7; filter: url(#soft); }
      .accent { fill: #EFF6FF; stroke: #DDE9FF; }
      .yellow { fill: #FFFAF0; stroke: #F3E7D6; }
      .green { fill: #F7FFF7; stroke: #DFF7E6; }
      .db { fill: #FFF; stroke: #E6EEF7; }
    ]]></style>
  </defs>

  <!-- Background subtle -->
  <rect width="100%" height="100%" fill="#FAFBFC" />

  <!-- Title -->
  <text x="60" y="72" class="header">مخطط معماري — منصة "مرايا"</text>
  <text x="60" y="100" class="sub">مخطط مرئي مُحسّن يوضح المكونات، العلاقات، وتدفق البيانات</text>

  <!-- Users cluster -->
  <g transform="translate(40,140)">
    <rect class="card" x="0" y="0" width="460" height="300" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">المستخدمون وواجهة العميل</text>

    <g transform="translate(28,68)">
      <rect x="0" y="0" width="180" height="56" rx="10" class="db" />
      <text x="18" y="36" class="box-text">تسجيل الدخول / Auth</text>

      <rect x="200" y="0" width="220" height="56" rx="10" class="db" />
      <text x="220" y="36" class="box-text">الملف الشخصي (Profile)</text>

      <rect x="0" y="76" width="420" height="56" rx="10" class="db" />
      <text x="18" y="112" class="box-text">تطبيقات: ويب — أندرويد — iOS — API للجهات الخارجية</text>
    </g>
  </g>

  <!-- Social Graph -->
  <g transform="translate(540,140)">
    <rect class="card" x="0" y="0" width="420" height="300" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">العلاقات الاجتماعية &amp; التفاعل</text>

    <g transform="translate(28,68)">
      <rect x="0" y="0" width="200" height="56" rx="10" class="accent" />
      <text x="20" y="36" class="box-text">الأصدقاء / المتابعون (Graph DB)</text>

      <rect x="220" y="0" width="172" height="56" rx="10" class="accent" />
      <text x="240" y="36" class="box-text">القنوات / الصفحات / المجموعات</text>

      <rect x="0" y="76" width="372" height="56" rx="10" class="db" />
      <text x="20" y="112" class="box-text">الأنشطة: منشورات، تعليقات، تفاعلات</text>
    </g>
  </g>

  <!-- Feed & Recommendation -->
  <g transform="translate(40,480)">
    <rect class="card" x="0" y="0" width="460" height="340" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">خدمة الخلاصات (Feed) و التوصية</text>

    <g transform="translate(28,68)">
      <rect x="0" y="0" width="212" height="56" rx="10" class="yellow" />
      <text x="22" y="36" class="box-text">Feed Generator (قواعد &amp; محركات)</text>

      <rect x="232" y="0" width="176" height="56" rx="10" class="yellow" />
      <text x="252" y="36" class="box-text">Recommendation Engine (ML — Graph + Content)</text>

      <rect x="0" y="84" width="420" height="70" rx="10" class="db" />
      <text x="22" y="122" class="box-text">Personalization &amp; Signals — اهتمامات، تاريخ، إشارات اجتماعية، حداثة</text>
    </g>
  </g>

  <!-- Backend Services -->
  <g transform="translate(540,480)">
    <rect class="card" x="0" y="0" width="420" height="340" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">خدمات الباك-إند &amp; البنية التحتية</text>

    <g transform="translate(28,68)">
      <rect x="0" y="0" width="200" height="56" rx="10" class="green" />
      <text x="20" y="36" class="box-text">API Gateway &amp; Auth Service</text>

      <rect x="220" y="0" width="172" height="56" rx="10" class="green" />
      <text x="240" y="36" class="box-text">Realtime (WebSocket/RTC) &amp; Message Broker</text>

      <rect x="0" y="76" width="392" height="56" rx="10" class="db" />
      <text x="20" y="112" class="box-text">Workers / Background Jobs (Notifications, Media processing)</text>
    </g>
  </g>

  <!-- Storage and DBs -->
  <g transform="translate(980,140)">
    <rect class="card" x="0" y="0" width="520" height="360" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">قاعدة البيانات و التخزين</text>

    <g transform="translate(28,72)">
      <rect x="0" y="0" width="460" height="56" rx="10" class="db" />
      <text x="20" y="36" class="box-text">User DB (SQL — profiles, auth)</text>

      <rect x="0" y="76" width="460" height="56" rx="10" class="db" />
      <text x="20" y="112" class="box-text">Graph DB (Neo4j / Janus — علاقات اجتماعية)</text>

      <rect x="0" y="152" width="460" height="56" rx="10" class="db" />
      <text x="20" y="188" class="box-text">Feed DB / Cache (Redis, Materialized Views)</text>

      <rect x="0" y="228" width="460" height="56" rx="10" class="db" />
      <text x="20" y="264" class="box-text">Media Storage (Object Storage + CDN)</text>
    </g>
  </g>

  <!-- Analytics & Moderation -->
  <g transform="translate(980,520)">
    <rect class="card" x="0" y="0" width="520" height="240" rx="14" ry="14" />
    <text x="28" y="36" class="box-title">تحليلات / مراقبة / أمن</text>

    <g transform="translate(28,68)">
      <rect x="0" y="0" width="460" height="56" rx="10" class="db" />
      <text x="20" y="36" class="box-text">Analytics DB / Event Store (Clickstream)</text>

      <rect x="0" y="76" width="460" height="56" rx="10" class="db" />
      <text x="20" y="112" class="box-text">Moderation &amp; Safety (ML + Human-in-loop)</text>
    </g>
  </g>

  <!-- Arrows -->
  <g class="small">
    <line x1="300" y1="360" x2="540" y2="420" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="360" y="390">طلبات API / WebSocket</text>

    <line x1="820" y1="780" x2="980" y2="640" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="860" y="720">قراءة/كتابة</text>

    <line x1="260" y1="700" x2="420" y2="520" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="300" y="620">خلاصات مخصصة</text>

    <line x1="740" y1="200" x2="520" y2="520" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="620" y="320">إشارات اجتماعية للسيرفر التوصية</text>

    <line x1="1200" y1="720" x2="460" y2="720" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="820" y="740">قواعد المحتوى/فلترة</text>
  </g>

  <!-- Footer / metadata -->
  <text x="60" y="1160" class="small">Generated and improved by GitHub Copilot — Satmhmd/drawdb — Updated: 2025-10-26</text>

</svg>
